<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>همتوار شخصی</title><script src="theme.js"></script><link rel="stylesheet" href="app.css"></head>
<body><header><div class="brand"><img src="assets/hamtavar-icon.png" width="40" height="40" alt=""><div>همتوار <strong>شخصی</strong><small id="today"></small></div></div><button id="settings" aria-label="تنظیمات و پشتیبان">تنظیمات</button></header>
<main id="main"></main><nav id="nav" aria-label="بخش‌های برنامه"></nav><p id="message" role="status" aria-live="polite" hidden></p>

<script src="app.js"></script></body></html>
