name: build-apk
on:
  push:
    branches: [main]
    paths: ['android/**', 'www/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: debug keystore (stable signature if secret set, else throwaway)
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          fi
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug -PappVersionCode=$GITHUB_RUN_NUMBER --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hamtavar-personal-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
