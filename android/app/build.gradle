apply plugin: 'com.android.application'
def appVersionCode = (project.findProperty('appVersionCode') ?: '2').toInteger()
def appVersionName = project.findProperty('appVersionName') ?: '1.2.0'
// https origin of the Hamtavar server (e.g. -PapiBase=https://personal.example.ir). Empty = fully offline app.
def apiBase = (project.findProperty('apiBase') ?: '').toString().trim().replaceAll('/+$', '')
android {
 namespace 'ir.hamtavar.personal'
 compileSdk 34
 defaultConfig {
   applicationId 'ir.hamtavar.personal'
   minSdk 23
   targetSdk 34
   versionCode appVersionCode
   versionName appVersionName
   buildConfigField 'String', 'API_BASE', "\"${apiBase}\""
 }
 buildFeatures { buildConfig true }
 signingConfigs {
   debug {
     storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
     storePassword 'android'
     keyAlias 'androiddebugkey'
     keyPassword 'android'
   }
 }
 buildTypes {
   debug {
     signingConfig signingConfigs.debug
   }
   release {
     signingConfig signingConfigs.debug
     minifyEnabled false
   }
 }
 sourceSets { main { assets.srcDir "$buildDir/generated/personalAssets" } }
}
tasks.register('syncPersonalWebAssets', Sync) {
 from rootProject.file('../www')
 into "$buildDir/generated/personalAssets/www"
}
tasks.named('preBuild').configure { dependsOn 'syncPersonalWebAssets' }
dependencies { implementation 'androidx.webkit:webkit:1.9.0' }
